  const [tampilkanPembahasan, setTampilkanPembahasan] = useState(false);

  const toggleMateri = (m) => {
    setSelectedMateri((prev) => (prev.includes(m) ? prev.filter((x) => x !== m) : [...prev, m]));
    setSelectedSubmateri([]);
  };

  const toggleSubmateri = (sm) => {
    setSelectedSubmateri((prev) => (prev.includes(sm) ? prev.filter((x) => x !== sm) : [...prev, sm]));
  };

  const submateriList = useMemo(() => {
    const set = new Set();
    soal.forEach((s) => {
      if (!s.submateri) return;
      if (selectedMateri.length > 0 && !selectedMateri.includes(s.materi)) return;
      set.add(s.submateri);
    });
    return Array.from(set).sort();
  }, [soal, selectedMateri]);

  const shuffle = (arr) => {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  // Membagi `n` soal secara serata di antara submateri yang dipilih.
  // Sisa pembagian (jika n tidak habis dibagi jumlah submateri) diacak
  // agar tidak selalu submateri yang sama yang kebagian lebih banyak.
  // Jika salah satu submateri kekurangan stok, kekurangannya diisi dari
  // submateri terpilih lain yang masih punya sisa, supaya jumlah total
  // tetap terpenuhi sebisa mungkin.
  const distribusiMerataSubmateri = (candidates, n, submateriKeys) => {
    const hasilPilih = [];
    const info = {};
    if (n <= 0 || submateriKeys.length === 0) return { hasilPilih, info };

    const grouped = {};
    submateriKeys.forEach((sm) => {
      grouped[sm] = shuffle(candidates.filter((c) => c.submateri === sm));
    });

    const k = submateriKeys.length;
    const base = Math.floor(n / k);
    const remainder = n % k;
    const urutan = shuffle(submateriKeys);
    const jatah = {};
    urutan.forEach((sm, idx) => {
      jatah[sm] = base + (idx < remainder ? 1 : 0);
    });

    let kekurangan = 0;
    const sisaPool = [];
    urutan.forEach((sm) => {
      const avail = grouped[sm] || [];
      const want = jatah[sm];
      const ambil = avail.slice(0, want);
      hasilPilih.push(...ambil);
      info[sm] = { target: want, actual: ambil.length, tersedia: avail.length };
      if (ambil.length < want) kekurangan += want - ambil.length;
      sisaPool.push(...avail.slice(want));
    });

    if (kekurangan > 0 && sisaPool.length > 0) {
      const tambahan = shuffle(sisaPool).slice(0, kekurangan);
      hasilPilih.push(...tambahan);
    }

    return { hasilPilih, info };
  };

  const generate = () => {
    const pool = soal.filter(
      (s) =>
        (selectedMateri.length === 0 || selectedMateri.includes(s.materi)) &&
        (selectedSubmateri.length === 0 || selectedSubmateri.includes(s.submateri)) &&
        (filterJenis === "semua" || s.jenisSoal === filterJenis)
    );
    const distribusiAktif = selectedSubmateri.length > 0;
    const jenisAktif = filterJenis === "semua" ? ["pg", "esai"] : [filterJenis];
    const jumlahByJenis = { pg: jumlahPG, esai: jumlahEsai };

    const result = [];
    const detailByJenis = {};
    const submateriAgg = {};
    if (distribusiAktif) {
      selectedSubmateri.forEach((sm) => {
        submateriAgg[sm] = { target: 0, actual: 0 };
      });
    }

    jenisAktif.forEach((jn) => {
      const poolByTingkat = {};
      const targetByTingkat = {};
      Object.keys(TINGKAT).forEach((tk) => {
        const n = Math.max(0, parseInt(jumlahByJenis[jn][tk], 10) || 0);
        const candidates = pool.filter((s) => s.tingkat === tk && s.jenisSoal === jn);
        poolByTingkat[tk] = candidates;
        targetByTingkat[tk] = Math.min(n, candidates.length);
        if (distribusiAktif) {
          const { hasilPilih, info } = distribusiMerataSubmateri(candidates, n, selectedSubmateri);
          result.push(...hasilPilih);
          Object.entries(info).forEach(([sm, v]) => {
            if (!submateriAgg[sm]) submateriAgg[sm] = { target: 0, actual: 0 };
            submateriAgg[sm].target += v.target;
            submateriAgg[sm].actual += v.actual;
          });
        } else {
          result.push(...shuffle(candidates).slice(0, n));
        }
      });
      detailByJenis[jn] = { pool: poolByTingkat, target: targetByTingkat };
    });

    let hasilAkhir = result;
    if (filterJenis === "semua" && kelompokkanJenis) {
      const pg = result.filter((s) => s.jenisSoal === "pg");
      const esai = result.filter((s) => s.jenisSoal !== "pg");
      hasilAkhir = [...pg, ...esai];
    }
    setHasil(hasilAkhir);
    setPoolInfo(detailByJenis);
    setSubmateriInfo(distribusiAktif ? submateriAgg : null);
  };

  const batasBagian = useMemo(() => {
    if (!hasil || filterJenis !== "semua" || !kelompokkanJenis) return null;
    const idx = hasil.findIndex((s) => s.jenisSoal !== "pg");
    const totalPg = idx === -1 ? hasil.length : idx;
    const totalEsai = hasil.length - totalPg;
    if (totalPg === 0 || totalEsai === 0) return null;
    return { esaiStart: idx, totalPg, totalEsai };
  }, [hasil, filterJenis, kelompokkanJenis]);

  const teksEvaluasi = useMemo(() => {
    if (!hasil) return "";
    return hasil
      .map((s, i) => {
        let prefix = "";
        if (batasBagian) {
          if (i === 0) {
            prefix = `=== BAGIAN A: PILIHAN GANDA (${batasBagian.totalPg} soal) ===\n\n`;
          } else if (i === batasBagian.esaiStart) {
            prefix = `\n=== BAGIAN B: ESAI (${batasBagian.totalEsai} soal) ===\n\n`;
          }
        }
        let blok = `${prefix}${i + 1}. ${s.soalText}`;
        if (s.jenisSoal === "pg" && Array.isArray(s.opsi)) {
          blok += "\n" + s.opsi.map((o) => `   ${o.huruf}. ${o.teks}`).join("\n");
        }
        return blok;
      })
      .join("\n\n");
  }, [hasil, batasBagian]);

  const totalTersedia = (tk, jn) =>
    soal.filter(
      (s) =>
        s.tingkat === tk &&
        s.jenisSoal === jn &&
        (selectedMateri.length === 0 || selectedMateri.includes(s.materi)) &&
        (selectedSubmateri.length === 0 || selectedSubmateri.includes(s.submateri))
    ).length;

  return (
    <div>
      <div
        style={{
          background: "#12233A",
          border: "1px solid #24354F",
          borderRadius: 8,
          padding: 18,
          marginBottom: 18,
        }}
      >
        <div style={{ ...labelStyle, marginBottom: 10 }}>1. Pilih materi (kosongkan untuk semua materi)</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 20 }}>
          {materiList.length === 0 && (
            <span style={{ color: "#64789C", fontSize: 13 }}>
              Belum ada materi. Tambahkan soal terlebih dahulu.
            </span>
          )}
          {materiList.map((m) => {
            const active = selectedMateri.includes(m);
            return (
              <button
                key={m}
                onClick={() => toggleMateri(m)}
                style={{
                  padding: "6px 12px",
                  borderRadius: 20,
                  border: active ? "1.5px solid #4C8DFF" : "1px solid #24354F",
                  background: active ? "#16324F" : "#12233A",
                  color: active ? "#4C8DFF" : "#8DA0BC",
                  fontSize: 13,
                  fontWeight: active ? 700 : 500,
                  cursor: "pointer",
                }}
              >
                {m}
              </button>
            );
          })}
        </div>

        {submateriList.length > 0 && (
          <>
            <div style={{ ...labelStyle, marginBottom: 10 }}>
              Pilih submateri (opsional, kosongkan untuk semua submateri{selectedMateri.length > 0 ? " dari materi terpilih" : ""})
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 10 }}>
              {submateriList.map((sm) => {
                const active = selectedSubmateri.includes(sm);
                return (
                  <button
                    key={sm}
                    onClick={() => toggleSubmateri(sm)}
                    style={{
                      padding: "6px 12px",
                      borderRadius: 20,
                      border: active ? "1.5px solid #A78BFA" : "1px solid #24354F",
                      background: active ? "#241C40" : "#12233A",
                      color: active ? "#A78BFA" : "#8DA0BC",
                      fontSize: 13,
                      fontWeight: active ? 700 : 500,
                      cursor: "pointer",
                    }}
                  >
                    {sm}
                  </button>
                );
              })}
            </div>
            {selectedSubmateri.length > 0 && (
              <div style={{ fontSize: 11.5, color: "#A78BFA", marginBottom: 20, lineHeight: 1.6 }}>
                Distribusi merata aktif: soal akan dibagi rata di antara {selectedSubmateri.length} submateri terpilih (per tingkat kesulitan), sehingga tidak menumpuk di satu submateri saja.
              </div>
            )}
            {selectedSubmateri.length === 0 && <div style={{ marginBottom: 20 }} />}
          </>
        )}

        <div style={{ ...labelStyle, marginBottom: 10 }}>2. Jenis soal</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 20 }}>
          {[
            { key: "semua", label: "Keduanya (Esai + PG)" },
            { key: "esai", label: "Esai saja" },
            { key: "pg", label: "Pilihan Ganda saja" },
          ].map((opt) => {
            const active = filterJenis === opt.key;
            return (
              <button
                key={opt.key}
                onClick={() => setFilterJenis(opt.key)}
                style={{
                  padding: "8px 14px",
                  borderRadius: 5,
                  border: active ? "2px solid #4C8DFF" : "1px solid #24354F",
                  background: active ? "#16324F" : "#12233A",
                  color: active ? "#4C8DFF" : "#8DA0BC",
                  fontWeight: active ? 700 : 500,
                  cursor: "pointer",
                  fontSize: 13,
                  fontFamily: "inherit",
                }}
              >
                {opt.label}
              </button>
            );
          })}
        </div>

        {filterJenis === "semua" && (
          <label
            style={{
              display: "flex",
              gap: 8,
              alignItems: "center",
              fontSize: 12.5,
              color: "#8DA0BC",
              marginBottom: 20,
              cursor: "pointer",
            }}
          >
            <input
              type="checkbox"
              checked={kelompokkanJenis}
              onChange={(e) => setKelompokkanJenis(e.target.checked)}
            />
            Kelompokkan soal: semua Pilihan Ganda (Bagian A) tampil dulu, baru Esai (Bagian B)
          </label>
        )}

        <div style={{ ...labelStyle, marginBottom: 10 }}>3. Jumlah soal per tingkat kesulitan</div>

        {(filterJenis === "semua" || filterJenis === "pg") && (
          <div style={{ marginBottom: filterJenis === "semua" ? 16 : 20 }}>
            {filterJenis === "semua" && (
              <div style={{ fontSize: 12.5, fontWeight: 700, color: "#4C8DFF", marginBottom: 8 }}>
                Pilihan Ganda &middot; total {Object.values(jumlahPG).reduce((a, b) => a + (parseInt(b, 10) || 0), 0)} soal
              </div>
            )}
            <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
              {Object.keys(TINGKAT).map((tk) => (
                <div key={tk} style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                  <Badge tingkat={tk} />
                  <input
                    type="number"
                    min={0}
                    max={totalTersedia(tk, "pg")}
                    value={jumlahPG[tk]}
                    onChange={(e) => setJumlahPG((prev) => ({ ...prev, [tk]: e.target.value }))}
                    style={{ ...inputStyle, width: 90 }}
                  />
                  <span style={{ fontSize: 11.5, color: "#64789C" }}>tersedia: {totalTersedia(tk, "pg")}</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {(filterJenis === "semua" || filterJenis === "esai") && (
          <div style={{ marginBottom: 20 }}>
            {filterJenis === "semua" && (
              <div style={{ fontSize: 12.5, fontWeight: 700, color: "#A78BFA", marginBottom: 8 }}>
                Esai &middot; total {Object.values(jumlahEsai).reduce((a, b) => a + (parseInt(b, 10) || 0), 0)} soal
              </div>
            )}
            <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
              {Object.keys(TINGKAT).map((tk) => (
                <div key={tk} style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                  <Badge tingkat={tk} />
                  <input
                    type="number"
                    min={0}
                    max={totalTersedia(tk, "esai")}
                    value={jumlahEsai[tk]}
                    onChange={(e) => setJumlahEsai((prev) => ({ ...prev, [tk]: e.target.value }))}
                    style={{ ...inputStyle, width: 90 }}
                  />
                  <span style={{ fontSize: 11.5, color: "#64789C" }}>tersedia: {totalTersedia(tk, "esai")}</span>
                </div>
              ))}
            </div>
          </div>
        )}

        <div style={{ ...labelStyle, marginBottom: 10 }}>4. Durasi waktu pengerjaan</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 12 }}>
          {DURASI_PRESET.map((menit) => {
            const active = Number(durasiMenit) === menit;
            return (
              <button
                key={menit}
                onClick={() => setDurasiMenit(menit)}
                style={{
                  padding: "8px 14px",
                  borderRadius: 5,
                  border: active ? "2px solid #4C8DFF" : "1px solid #24354F",
                  background: active ? "#16324F" : "#12233A",
                  color: active ? "#4C8DFF" : "#8DA0BC",
                  fontWeight: active ? 700 : 500,
                  cursor: "pointer",
                  fontSize: 13,
                  fontFamily: "inherit",
                }}
              >
                {menit === 0 ? "Tanpa batas" : `${menit} menit`}
              </button>
            );
          })}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 20 }}>
          <span style={{ fontSize: 13, color: "#8DA0BC" }}>Atau durasi kustom:</span>
          <input
            type="number"
            min={0}
            value={durasiMenit}
            onChange={(e) => setDurasiMenit(e.target.value)}
            style={{ ...inputStyle, width: 90 }}
          />
          <span style={{ fontSize: 13, color: "#8DA0BC" }}>menit</span>
          <span style={{ fontSize: 11.5, color: "#64789C" }}>
            (isi 0 jika tidak ingin membatasi waktu)
          </span>
        </div>

        <button onClick={generate} style={primaryBtnStyle}>
          Buat evaluasi
        </button>
      </div>

      {hasil && (
        <div
          style={{
            background: "#12233A",
            border: "1px solid #24354F",
            borderRadius: 8,
            padding: 18,
          }}
        >
          <div
            style={{
              display: "flex",
              justifyContent: "space-between",
              alignItems: "center",
              marginBottom: 14,
              flexWrap: "wrap",
              gap: 10,
            }}
          >
            <h3
              style={{
                margin: 0,
                fontFamily: "Georgia, 'Iowan Old Style', serif",
                fontSize: 18,
                color: "#5B9BFF",
              }}
            >
              Pratinjau evaluasi ({hasil.length} soal)
            </h3>
            <label style={{ fontSize: 13, color: "#8DA0BC", display: "flex", gap: 6, alignItems: "center" }}>
              <input
                type="checkbox"
                checked={tampilkanPembahasan}
                onChange={(e) => setTampilkanPembahasan(e.target.checked)}
              />
              Sertakan pembahasan
            </label>
          </div>

          <div
            style={{
              fontSize: 12.5,
              color: "#8DA0BC",
              background: "#16324F",
              border: "1px solid #5B9BFF33",
              borderRadius: 6,
              padding: "10px 12px",
              marginBottom: 14,
              lineHeight: 1.6,
            }}
          >
            Contoh di bawah hanya pratinjau satu kombinasi. Saat diunduh sebagai HTML, tiap siswa otomatis mendapat kombinasi soal, urutan soal, dan urutan opsi A-E yang berbeda-beda (diacak dari seluruh soal tersedia per tingkat kesulitan), tapi jumlah soal mudah/sedang/sukar tetap sama untuk semua siswa.
          </div>

          {poolInfo &&
            Object.keys(poolInfo).flatMap((jn) =>
              Object.keys(TINGKAT).map((tk) => {
                const detail = poolInfo[jn];
                const tersedia = detail.pool[tk] ? detail.pool[tk].length : 0;
                const butuh = detail.target[tk] || 0;
                const jenisLabel = jn === "pg" ? "Pilihan Ganda" : "Esai";
                if (butuh === 0) return null;
                if (tersedia <= butuh) {
                  return (
                    <div
                      key={`${jn}-${tk}`}
                      style={{
                        fontSize: 12.5,
                        color: "#F87171",
                        background: "#2A1414",
                        border: "1px solid #F8717133",
                        borderRadius: 6,
                        padding: "10px 12px",
                        marginBottom: 10,
                        lineHeight: 1.6,
                      }}
                    >
                      ⚠️ Soal {jenisLabel} tingkat {TINGKAT[tk].label} hanya tersedia {tersedia}, padahal tiap siswa butuh {butuh}. Semua siswa akan mendapat soal yang sama persis (hanya urutannya diacak) — tambahkan lebih banyak soal {jenisLabel} tingkat {TINGKAT[tk].label} ke bank soal untuk variasi yang nyata.
                    </div>
                  );
                }
                if (tersedia < butuh * 1.5) {
                  return (
                    <div
                      key={`${jn}-${tk}`}
                      style={{
                        fontSize: 12.5,
                        color: "#FCD34C",
                        background: "#2A2210",
                        border: "1px solid #FBBF2433",
                        borderRadius: 6,
                        padding: "10px 12px",
                        marginBottom: 10,
                        lineHeight: 1.6,
                      }}
                    >
                      ⚠️ Soal {jenisLabel} tingkat {TINGKAT[tk].label} tersedia {tersedia} untuk kebutuhan {butuh} per siswa — variasi antar siswa masih cukup terbatas. Menambah soal {jenisLabel} tingkat {TINGKAT[tk].label} akan membuat kombinasi tiap siswa lebih beragam.
                    </div>
                  );
                }
                return null;
              })
            )}

          {submateriInfo &&
            Object.entries(submateriInfo).map(([sm, v]) => {
              if (v.target === 0 || v.actual >= v.target) return null;
              return (
                <div
                  key={sm}
                  style={{
                    fontSize: 12.5,
                    color: "#FCD34C",
                    background: "#2A2210",
                    border: "1px solid #FBBF2433",
                    borderRadius: 6,
                    padding: "10px 12px",
                    marginBottom: 10,
                    lineHeight: 1.6,
                  }}
                >
                  ⚠️ Submateri "{sm}" seharusnya kebagian {v.target} soal secara merata, tapi stoknya hanya cukup untuk {v.actual}. Kekurangannya diisi dari submateri lain yang dipilih agar jumlah total tetap terpenuhi — tambahkan lebih banyak soal untuk submateri "{sm}" agar distribusinya benar-benar merata.
                </div>
              );
            })}

          {hasil.length === 0 ? (
            <div style={{ color: "#64789C", fontSize: 14 }}>
              Tidak ada soal yang cocok dengan pilihan Anda. Coba ubah materi atau jumlah soal.
            </div>
          ) : (
            <>
              {hasil.map((s, i) => (
                <React.Fragment key={s.id}>
                  {batasBagian && i === 0 && (
                    <div
                      style={{
                        fontFamily: "Georgia, 'Iowan Old Style', serif",
                        fontSize: 14.5,
                        fontWeight: 700,
                        color: "#4C8DFF",
                        background: "#16324F",
                        border: "1px solid #4C8DFF33",
                        borderRadius: 6,
                        padding: "8px 12px",
                        marginBottom: 12,
                      }}
                    >
                      Bagian A: Pilihan Ganda ({batasBagian.totalPg} soal)
                    </div>
                  )}
                  {batasBagian && i === batasBagian.esaiStart && (
                    <div
                      style={{
                        fontFamily: "Georgia, 'Iowan Old Style', serif",
                        fontSize: 14.5,
                        fontWeight: 700,
                        color: "#A78BFA",
                        background: "#241C40",
                        border: "1px solid #A78BFA33",
                        borderRadius: 6,
                        padding: "8px 12px",
                        marginTop: 18,
                        marginBottom: 12,
                      }}
                    >
                      Bagian B: Esai ({batasBagian.totalEsai} soal)
                    </div>
                  )}
                  <div style={{ marginBottom: 14 }}>
                    <div style={{ display: "flex", gap: 8, marginBottom: 6, alignItems: "center" }}>
                      <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12.5, color: "#7891B5" }}>
                        {i + 1}.
                      </span>
                      <MateriTag>{s.materi}</MateriTag>
                      {s.submateri && <SubmateriTag>{s.submateri}</SubmateriTag>}
                      <Badge tingkat={s.tingkat} />
                    </div>
                    <div style={{ whiteSpace: "pre-wrap", fontSize: 14, color: "#E4EAF3", lineHeight: 1.6, paddingLeft: 20 }}>
                      <MathText text={s.soalText} />
                      {s.soalImage && (
                        <div style={{ marginTop: 10 }}>
                          <img
                            src={s.soalImage}
                            alt="Gambar soal"
                            style={{ maxWidth: "100%", maxHeight: 280, borderRadius: 6, border: "1px solid #24354F" }}
                          />
                        </div>
                      )}
                      {s.jenisSoal === "pg" && (
                        <OpsiList opsi={s.opsi} kunciJawaban={tampilkanPembahasan ? s.kunciJawaban : null} />
                      )}
                    </div>
                    {tampilkanPembahasan && (
                      <div style={{ paddingLeft: 20, marginTop: 6 }}>
                        <div style={{ fontSize: 12, fontWeight: 700, color: "#8DA0BC", marginBottom: 4 }}>
                          Pembahasan
                        </div>
                        <div style={{ whiteSpace: "pre-wrap", fontSize: 13.5, color: "#B8C4D9", lineHeight: 1.6 }}>
                          <PembahasanView item={s} />
                        </div>
                      </div>
                    )}
                  </div>
                </React.Fragment>
              ))}

              <div style={{ marginTop: 18 }}>
                <div style={{ ...labelStyle, marginBottom: 8 }}>
                  Teks siap salin (untuk ditempel ke Word/Google Docs)
                </div>
                <textarea
                  readOnly
                  value={teksEvaluasi}
                  rows={8}
                  onFocus={(e) => e.target.select()}
                  style={{ ...inputStyle, fontFamily: "'JetBrains Mono', monospace", fontSize: 12.5, resize: "vertical" }}
                />
                <div style={{ fontSize: 11.5, color: "#64789C", marginTop: 6 }}>
                  Hanya berisi daftar soal (tanpa kategori materi, tingkat kesulitan, atau pembahasan) — siap dibagikan ke siswa.
                </div>
              </div>

              {poolInfo && (
                <HtmlPublisher
                  pool={{ pg: (poolInfo.pg || {}).pool || {}, esai: (poolInfo.esai || {}).pool || {} }}
                  target={{ pg: (poolInfo.pg || {}).target || {}, esai: (poolInfo.esai || {}).target || {} }}

function loadAiSettings() {
  const dasar = { provider: "gemini", keys: {}, models: {} };
  try {
    const raw = localStorage.getItem(AI_SETTINGS_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      const hasil = { ...dasar, ...p, keys: { ...(p.keys || {}) }, models: { ...(p.models || {}) }, dynModels: { ...(p.dynModels || {}) } };
      // Model Gemini 2.0/2.5 sudah dimatikan Google, kembalikan ke bawaan
      if (/^gemini-(2\.0|2\.5)/.test(hasil.models.gemini || "")) delete hasil.models.gemini;
      if (hasil.dynModels.gemini) hasil.dynModels.gemini = hasil.dynModels.gemini.filter((m) => !/^gemini-(2\.0|2\.5)/.test(m.id));
      return hasil;
    }
  } catch (e) { /* abaikan */ }
  return dasar;
}

function saveAiSettings(s) {
  try { localStorage.setItem(AI_SETTINGS_KEY, JSON.stringify(s)); } catch (e) { /* abaikan */ }
}

function pesanErrorAI(status, data) {
  const asli = (data && data.error && data.error.message) ? String(data.error.message) : "";
  let utama;
  if (status === 404) utama = "Model ini tidak tersedia (kemungkinan sudah dihentikan penyedia). Pilih model lain, atau klik \"Muat daftar model dari akun\".";
  else if (status === 400 && /api key/i.test(asli)) utama = "Kunci API tidak valid.";
  else if (status === 401 || status === 403) utama = "Kunci API ditolak atau tidak punya izin untuk model ini.";
  else if (status === 429) utama = "Kuota/batas permintaan habis. Tunggu sebentar, atau pilih model lain.";
  else if (status === 503 || status === 529) utama = "Server AI sedang sibuk. Coba lagi sebentar lagi.";
  else utama = "Permintaan gagal (" + status + ").";
  return asli ? utama + " [" + asli.slice(0, 160) + "]" : utama;
}

async function muatDaftarModel(settings) {
  const provider = settings.provider;
  const key = (settings.keys[provider] || "").trim();
  if (!key) throw new Error("Isi kunci API dulu.");
  let res, data, daftar;
  if (provider === "gemini") {
    res = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200", { headers: { "x-goog-api-key": key } });
    data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(pesanErrorAI(res.status, data));
    daftar = (data.models || [])
      .filter((m) => (m.supportedGenerationMethods || []).includes("generateContent"))
      .map((m) => ({ id: String(m.name || "").replace(/^models\//, ""), label: m.displayName || m.name }))
      .filter((m) => /^gemini-/.test(m.id) && !/image|tts|live|audio|embedding|robotics|computer|veo|omni|vision|gemma|learnlm|aqa/i.test(m.id))
      .filter((m) => !/^gemini-(2\.0|2\.5)/.test(m.id));
  } else {
    res = await fetch("https://api.anthropic.com/v1/models?limit=100", {
      headers: { "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
    });
    data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(pesanErrorAI(res.status, data));
    daftar = (data.data || []).map((m) => ({ id: m.id, label: m.display_name || m.id }));
  }
  if (daftar.length === 0) throw new Error("Tidak ada model yang cocok ditemukan di akun ini.");
  return daftar;
}

async function panggilAI(settings, prompt) {
  const provider = settings.provider;
  const key = (settings.keys[provider] || "").trim();
  const model = (settings.models[provider] || AI_PROVIDERS[provider].model).trim();
  if (!key) throw new Error("Kunci API belum diisi.");
  let res, data, text;
  if (provider === "gemini") {
    res = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) + ":generateContent",
      {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-goog-api-key": key },
        body: JSON.stringify({
          contents: [{ role: "user", parts: [{ text: prompt }] }],
          generationConfig: { responseMimeType: "application/json", temperature: 0.7 },
        }),
      }
    );
    data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(pesanErrorAI(res.status, data));
    const parts = (((data.candidates || [])[0] || {}).content || {}).parts || [];
    text = parts.map((p) => p.text || "").join("");
  } else {
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({ model, max_tokens: 8000, messages: [{ role: "user", content: prompt }] }),
    });
    data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(pesanErrorAI(res.status, data));
    text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
  }
  return text;
}

function parseHasilAI(text, c) {
  let t = String(text || "").trim().replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
  const a = t.indexOf("[{") !== -1 ? t.indexOf("[{") : t.indexOf("[");
  const b = t.lastIndexOf("]");
  if (a === -1 || b === -1) throw new Error("Jawaban AI tidak berbentuk daftar soal. Coba buat ulang.");
  let arr;
  try { arr = JSON.parse(t.slice(a, b + 1)); } catch (e) { throw new Error("Jawaban AI terpotong atau tidak valid. Coba buat ulang, atau kurangi jumlah soal."); }
  if (!Array.isArray(arr)) throw new Error("Format jawaban AI tidak sesuai.");
  const hasil = [];
  arr.forEach((it) => {
    if (!it || !String(it.soalText || "").trim()) return;
    const base = {
      materi: c.materi,
      submateri: c.submateri || "",
      tingkat: c.tingkat,
      jenisSoal: c.jenisSoal,
      soalText: String(it.soalText).trim(),
      soalImage: null,
      pembahasanType: "teks",
      pembahasanText: String(it.pembahasanText || "").trim(),
      pembahasanImage: null,
    };
    if (c.jenisSoal === "pg") {
      const opsi = (Array.isArray(it.opsi) ? it.opsi : [])
        .slice(0, OPSI_HURUF.length)
        .map((o, idx) => ({ huruf: OPSI_HURUF[idx], teks: String((o && o.teks) != null ? o.teks : o || "").trim() }))
        .filter((o) => o.teks !== "");
      const kunci = String(it.kunciJawaban || "").trim().toUpperCase().slice(0, 1);
      if (opsi.length < 2 || !opsi.some((o) => o.huruf === kunci)) return;
      hasil.push({ ...base, opsi, kunciJawaban: kunci });
    } else {
      hasil.push({ ...base, opsi: [], kunciJawaban: "" });
    }
  });
  if (hasil.length === 0) throw new Error("Tidak ada soal valid dari jawaban AI. Coba buat ulang.");
  return hasil;
}

          <button onClick={() => pilihCara("salin")} style={{ ...pilihBtn(cara === "salin"), minWidth: 200 }}>Salin prompt, tempel hasil</button>
          <button onClick={() => pilihCara("kunci")} style={{ ...pilihBtn(cara === "kunci"), minWidth: 200 }}>Pakai kunci API</button>
        </div>
        <div style={{ fontSize: 11.5, color: "#64789C", marginTop: 6, lineHeight: 1.6 }}>
          {cara === "salin"
            ? "Tanpa kunci API. Aplikasi menyusun prompt, Anda menempelkannya ke Gemini, ChatGPT, atau Claude di browser (akun gratis cukup), lalu menempel jawabannya kembali ke sini."
            : "Aplikasi memanggil AI langsung dengan kunci API Anda, jadi hasil muncul otomatis tanpa salin-tempel."}
        </div>
      </div>

      {cara === "kunci" && (
      <div style={{ border: "1px solid #1A2E48", borderRadius: 8, padding: 12, background: "#101E30" }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: "#8DA0BC", marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.04em" }}>Pengaturan AI</div>
        <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
          {Object.keys(AI_PROVIDERS).map((k) => (
            <button key={k} onClick={() => { setModelManual(false); updSettings((p) => ({ ...p, provider: k })); }} style={pilihBtn(prov === k)}>{AI_PROVIDERS[k].label}</button>
          ))}
        </div>
        <label style={labelStyle}>Kunci API</label>
        <div style={{ display: "flex", gap: 8 }}>
          <input
            type={showKey ? "text" : "password"}
            value={settings.keys[prov] || ""}
            onChange={(e) => updSettings((p) => ({ ...p, keys: { ...p.keys, [prov]: e.target.value } }))}
            placeholder="Tempel kunci API di sini"
            autoComplete="off"
            style={{ ...inputStyle, flex: 1 }}
          />
          <button onClick={() => setShowKey((s) => !s)} style={linkBtnStyle}>{showKey ? "Sembunyikan" : "Tampilkan"}</button>
        </div>
        <label style={{ ...labelStyle, marginTop: 10 }}>Model</label>
        {(() => {
          const daftar = (settings.dynModels && settings.dynModels[prov]) || AI_PROVIDERS[prov].models;
          const modelNow = settings.models[prov] != null ? settings.models[prov] : AI_PROVIDERS[prov].model;
          const dalamDaftar = daftar.some((m) => m.id === modelNow);
          const tampilManual = modelManual || !dalamDaftar;
          return (
            <>
              <select
                value={tampilManual ? "__lain__" : modelNow}
                onChange={(e) => {
                  if (e.target.value === "__lain__") {
                    setModelManual(true);
                  } else {
                    setModelManual(false);
                    updSettings((p) => ({ ...p, models: { ...p.models, [prov]: e.target.value } }));
                  }
                }}
                style={{ ...inputStyle, cursor: "pointer" }}
              >
                {daftar.map((m) => (<option key={m.id} value={m.id}>{m.label}</option>))}
                <option value="__lain__">Lainnya (ketik nama model sendiri)</option>
              </select>
              {tampilManual && (
                <input
                  value={modelNow}
                  onChange={(e) => updSettings((p) => ({ ...p, models: { ...p.models, [prov]: e.target.value } }))}
                  placeholder="Nama model, mis. gemini-3.5-flash"
                  style={{ ...inputStyle, marginTop: 8 }}
                />
              )}
              <button
                disabled={muatLoading}
                onClick={async () => {
                  setMuatLoading(true);
                  setMuatStatus("");
                  try {
                    const dl = await muatDaftarModel(settings);
                    const ada = dl.some((m) => m.id === modelNow);
                    const pilih = ada ? modelNow : (dl.find((m) => m.id === AI_PROVIDERS[prov].model) || dl.find((m) => /flash|sonnet/i.test(m.id)) || dl[0]).id;
                    setModelManual(false);
                    updSettings((p) => ({ ...p, dynModels: { ...(p.dynModels || {}), [prov]: dl }, models: { ...p.models, [prov]: pilih } }));
                    setMuatStatus("Berhasil: " + dl.length + " model tersedia di akun Anda.");
                  } catch (e) {
                    setMuatStatus("Gagal memuat: " + (/failed to fetch|networkerror|load failed/i.test(String(e && e.message)) ? "tidak bisa terhubung ke server AI." : (e && e.message ? e.message : e)));
                  } finally {
                    setMuatLoading(false);
                  }
                }}
                style={{ ...linkBtnStyle, marginTop: 8, opacity: muatLoading ? 0.6 : 1 }}
              >
                {muatLoading ? "Memuat..." : "Muat daftar model dari akun"}
              </button>
              {muatStatus && <div style={{ fontSize: 12, color: muatStatus.startsWith("Berhasil") ? "#34D399" : "#F87171", marginTop: 4, lineHeight: 1.5 }}>{muatStatus}</div>}
            </>
          );
        })()}
        <div style={{ fontSize: 11.5, color: "#64789C", marginTop: 8, lineHeight: 1.6 }}>
          {AI_PROVIDERS[prov].hint}. Kunci hanya disimpan di browser ini dan dikirim langsung ke penyedia AI, tidak ikut masuk ke file ujian siswa. Jangan memakai fitur ini di komputer bersama.
        </div>
      </div>
      )}

      {err && <div style={{ color: "#F87171", fontSize: 13 }}>{err}</div>}
    </ModalShell>
  );
}

function BankSoalFisika({ onGantiPaket }) {
  const [isAuthenticated, setIsAuthenticated] = useState(false);
  const { soal, status, saving, syncError, retry, addSoal, updateSoal, deleteSoal, mergeImportSoal, replaceAllSoal } = useSoalStore();
  const [tab, setTab] = useState("bank"); // bank | evaluasi
  const [modalState, setModalState] = useState(null); // { mode: 'add' | 'edit', data? }
  const [filterMateri, setFilterMateri] = useState("Semua");
  const [filterSubmateri, setFilterSubmateri] = useState("Semua");
  const [filterTingkat, setFilterTingkat] = useState("Semua");
  const [search, setSearch] = useState("");
  const [expandedId, setExpandedId] = useState(null);
  const [importFileData, setImportFileData] = useState(null);
  const [importError, setImportError] = useState("");
  const [exportInfo, setExportInfo] = useState("");
  const [showReklasifikasi, setShowReklasifikasi] = useState(false);
  const [showCopyModal, setShowCopyModal] = useState(false);
  const [showPasteModal, setShowPasteModal] = useState(false);
  const importInputRef = useRef(null);

  const materiList = useMemo(() => Array.from(new Set(soal.map((s) => s.materi))).sort(), [soal]);

  const submateriByMateri = useMemo(() => {
    const map = {};
    soal.forEach((s) => {
      if (!s.submateri) return;
      if (!map[s.materi]) map[s.materi] = [];
      if (!map[s.materi].includes(s.submateri)) map[s.materi].push(s.submateri);
    });
    return map;
  }, [soal]);

  const submateriListForFilter = useMemo(() => {
    const set = new Set();
    soal.forEach((s) => {
      if (!s.submateri) return;
      if (filterMateri !== "Semua" && s.materi !== filterMateri) return;
      set.add(s.submateri);
    });
    return Array.from(set).sort();
  }, [soal, filterMateri]);

  const pengukuranTanpaSubmateri = useMemo(
    () => soal.filter((s) => s.materi === "Pengukuran" && !s.submateri),
    [soal]
  );

  const ringkasanMateri = useMemo(() => {
    const map = {};
    soal.forEach((s) => {
      if (!map[s.materi]) map[s.materi] = { total: 0, mudah: 0, sedang: 0, sukar: 0 };
      map[s.materi].total += 1;
      if (map[s.materi][s.tingkat] !== undefined) map[s.materi][s.tingkat] += 1;
    });
    return Object.entries(map).sort((a, b) => a[0].localeCompare(b[0]));
  }, [soal]);

  const filtered = useMemo(() => {
    return soal.filter((s) => {
      if (filterMateri !== "Semua" && s.materi !== filterMateri) return false;
      if (filterSubmateri !== "Semua" && (s.submateri || "") !== filterSubmateri) return false;
      if (filterTingkat !== "Semua" && s.tingkat !== filterTingkat) return false;
      if (search.trim()) {
        const q = search.toLowerCase();
        if (
          !s.soalText.toLowerCase().includes(q) &&
          !s.materi.toLowerCase().includes(q) &&
          !(s.submateri || "").toLowerCase().includes(q)
        )
          return false;
      }
      return true;
    });
  }, [soal, filterMateri, filterSubmateri, filterTingkat, search]);

  const handleFilterMateriChange = (value) => {
    setFilterMateri(value);
    setFilterSubmateri("Semua");
  };

  const handleSaveModal = (data) => {
    if (modalState && modalState.mode === "edit") {
      updateSoal(modalState.data.id, data);
    } else {
      addSoal(data);
    }
  };

  const handleSaveAI = (items) => {
    const withId = items.map((it) => ({ ...it, id: generateId() }));
    mergeImportSoal(withId);
    setModalState(null);
    setExportInfo(`${withId.length} soal buatan AI berhasil ditambahkan ke bank soal.`);
  };

  const handleExport = () => {
    const payload = {
      app: "bank-soal", mapel: PROFIL.mapel, jenjang: PROFIL.jenjang,
      version: EXPORT_VERSION,
      exportedAt: new Date().toISOString(),
      totalSoal: soal.length,
      soal,
    };
    const json = JSON.stringify(payload, null, 2);
    const tanggal = new Date().toISOString().slice(0, 10);
    const filename = `bank-soal-${(PROFIL.mapel + "-" + PROFIL.jenjang).toLowerCase().replace(/[^a-z0-9]+/g, "-")}-${tanggal}.json`;

    // Coba metode Blob + anchor terlebih dahulu (bekerja di kebanyakan browser normal)
    let sukses = false;
    try {
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.rel = "noopener";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      sukses = true;
    } catch (e) {
      sukses = false;
    }

    // Fallback: buka file di tab baru (andal di dalam iframe/sandbox yang memblokir unduhan otomatis)
    if (!sukses) {
      try {
        const blob = new Blob([json], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const win = window.open(url, "_blank");
        if (!win) {
          const dataUri = "data:application/json;charset=utf-8," + encodeURIComponent(json);
          window.open(dataUri, "_blank");
        }
        setTimeout(() => URL.revokeObjectURL(url), 30000);
      } catch (e2) {
        const dataUri = "data:application/json;charset=utf-8," + encodeURIComponent(json);
        window.open(dataUri, "_blank");
      }
      setExportInfo(
        `File dibuka di tab baru sebagai teks. Tekan Ctrl+S (atau Cmd+S) lalu simpan dengan nama "${filename}".`
      );
    } else {
      setExportInfo("");
    }
  };

  // Membangun payload JSON yang sama persis dengan hasil Ekspor,
  // lalu menyalin ke clipboard. Berguna saat unduhan file diblokir sandbox.
  const buildExportPayload = () =>
    JSON.stringify(
      {
        app: "bank-soal", mapel: PROFIL.mapel, jenjang: PROFIL.jenjang,
        version: EXPORT_VERSION,
        exportedAt: new Date().toISOString(),
        totalSoal: soal.length,
        soal,
      },
      null,
      2
    );

  const handleCopyAsText = async () => {
    const json = buildExportPayload();
    try {
      await navigator.clipboard.writeText(json);
      setExportInfo(`Berhasil menyalin ${soal.length} soal sebagai teks ke clipboard. Tinggal paste (Ctrl+V) ke mana pun.`);
    } catch (e) {
      // Fallback kalau navigator.clipboard diblokir: tampilkan modal berisi textarea
      // yang sudah terseleksi, tinggal Ctrl+C manual.
      setShowCopyModal(true);
    }
  };

  // Fungsi bersama untuk memvalidasi & mem-parsing teks JSON hasil ekspor,
  // dipakai baik oleh impor file maupun impor tempel-teks.
  const parseImportJson = (text) => {
    let parsed;
    try {
      parsed = JSON.parse(text);
    } catch (err) {
      return { error: "Teks/file bukan JSON yang valid." };
    }
    const items = Array.isArray(parsed) ? parsed : Array.isArray(parsed.soal) ? parsed.soal : null;
    if (!items) {
      return { error: "Format tidak dikenali. Gunakan hasil Ekspor / Salin sebagai Teks dari aplikasi ini." };
    }
    const valid = items.every(
      (it) => it && typeof it === "object" && typeof it.materi === "string" && typeof it.soalText === "string"
    );
    if (!valid) {
      return { error: "Isi tidak sesuai format soal (kolom materi/soalText hilang)." };
    }
    return { items };
  };

  const handleImportFileChange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setImportError("");
    const reader = new FileReader();
    reader.onerror = () => setImportError("Gagal membaca file. Pastikan file tidak rusak.");
    reader.onload = () => {
      const { items, error } = parseImportJson(reader.result);
      if (error) {
        setImportError(error);
      } else {
        setImportFileData(items);
      }
      if (importInputRef.current) importInputRef.current.value = "";
    };
    reader.readAsText(file);
  };

  const handleImportFromText = (text) => {
    const { items, error } = parseImportJson(text);
    if (error) {
      setImportError(error);
      return false;
    }
    setImportError("");
    setImportFileData(items);
    return true;
  };

  const handleMergeImport = (items) => {
    mergeImportSoal(items);
    setImportFileData(null);
  };

  const handleReplaceImport = (items) => {
    replaceAllSoal(items);
    setImportFileData(null);
  };

  if (!isAuthenticated) {
    return <LoginGate onSuccess={() => setIsAuthenticated(true)} />;
  }

  return (
    <div
      style={{
        fontFamily: "-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif",
        background:
          "linear-gradient(#0A1420, #0A1420), repeating-linear-gradient(0deg, #16283F 0, #16283F 1px, transparent 1px, transparent 32px), repeating-linear-gradient(90deg, #16283F 0, #16283F 1px, transparent 1px, transparent 32px)",
        minHeight: "100%",
        color: "#E4EAF3",
      }}
    >
      <div
        style={{
          background:
            "linear-gradient(#0B1A2E, #0B1A2E), repeating-linear-gradient(0deg, #1C3350 0, #1C3350 1px, transparent 1px, transparent 32px), repeating-linear-gradient(90deg, #1C3350 0, #1C3350 1px, transparent 1px, transparent 32px)",
          borderBottom: "1px solid #1C3350",
          padding: "26px 24px 20px",
        }}
      >
        <div style={{ maxWidth: 980, margin: "0 auto" }}>
          <div style={{ display: "flex", alignItems: "baseline", gap: 10, flexWrap: "wrap" }}>
            <h1
              style={{
                margin: 0,
                fontFamily: "Georgia, 'Iowan Old Style', serif",
                fontSize: 30,
                color: "#5B9BFF",
                letterSpacing: "-0.01em",
              }}
            >
              Bank Soal {PROFIL.mapel}
            </h1>
            <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, fontWeight: 700, color: "#5B9BFF", border: "1px solid #24354F", borderRadius: 4, padding: "2px 7px" }}>{PROFIL.jenjang}</span>
            <button onClick={onGantiPaket} style={linkBtnStyle}>⚙ Atur mapel</button>
            <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12, color: "#7891B5" }}>
              {soal.length} soal tersimpan · {materiList.length} materi
            </span>
          </div>
          <p style={{ margin: "6px 0 18px", color: "#8DA0BC", fontSize: 14 }}>
            Simpan soal beserta pembahasan, susun berdasarkan materi dan tingkat kesulitan, lalu rangkai jadi evaluasi.
          </p>

          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={() => setTab("bank")} style={tabBtnStyle(tab === "bank")}>
              Bank Soal
            </button>
            <button onClick={() => setTab("evaluasi")} style={tabBtnStyle(tab === "evaluasi")}>
              Buat Evaluasi
            </button>
          </div>
        </div>
      </div>

      <div style={{ maxWidth: 980, margin: "0 auto", padding: "22px 24px 60px" }}>
        {status === "loading" && (
          <div style={{ color: "#64789C", fontSize: 14, padding: 30, textAlign: "center" }}>
            Memuat soal dari Google Apps Script...
          </div>

        {status === "error" && (
          <div
            style={{
              color: "#F87171",
              fontSize: 13.5,
              background: "#2A1414",
              border: "1px solid #F8717133",
              borderRadius: 8,
              padding: "16px 18px",
              marginBottom: 18,
              display: "flex",
              flexDirection: "column",
              gap: 10,
              alignItems: "flex-start",
            }}
          >
            <span>{syncError}</span>
            <button

              style={{ ...secondaryBtnStyle, borderColor: "#F8717166", color: "#F87171" }}

              Coba Lagi
            </button>
          </div>

        {status === "ready" && syncError && (
          <div
            style={{
              color: "#FBBF24",
              fontSize: 13,
              background: "#2A2210",
              border: "1px solid #FBBF2433",
              borderRadius: 6,
              padding: "10px 12px",
              marginBottom: 14,

                  gap: 12,

                }}
              >
                <span style={{ fontSize: 13, color: "#C7B8F0", lineHeight: 1.6 }}>

                </span>

              >
                <div style={{ ...labelStyle, marginBottom: 10 }}>

                          filterMateri === materi

                      <span
                        style={{
                          fontFamily: "'JetBrains Mono', monospace",
                          fontSize: 12,
                          fontWeight: 700,
                          color: "#5B9BFF",
                          background: "#1A2E48",
                          borderRadius: 4,
                          padding: "2px 7px",

                  ))}

              )}

              >

                  <option key={tk} value={tk}>
                    {TINGKAT[tk].label}
                  </option>
                ))}
              </select>
              <input
                placeholder="Cari soal atau materi..."
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                style={{ ...inputStyle, width: 220 }}
              />
              <div style={{ flex: 1 }} />
              <button onClick={handleExport} style={{ ...secondaryBtnStyle, opacity: soal.length === 0 ? 0.5 : 1 }} disabled={soal.length === 0}>

              <button onClick={handleCopyAsText} style={{ ...secondaryBtnStyle, opacity: soal.length === 0 ? 0.5 : 1 }} disabled={soal.length === 0}>

              </button>
              <button onClick={() => importInputRef.current && importInputRef.current.click()} style={secondaryBtnStyle}>

              </button>
              <button onClick={() => setShowPasteModal(true)} style={secondaryBtnStyle}>

              </button>
              <input
                ref={importInputRef}

                onChange={handleImportFileChange}

              <button onClick={() => setModalState({ mode: "add" })} style={primaryBtnStyle}>
                + Tambah Soal

            </div>

            {importError && (
              <div
                style={{
                  color: "#F87171",
                  fontSize: 13,
                  background: "#2A1414",
                  border: "1px solid #F8717133",

            {exportInfo && (
              <div
                style={{
                  color: "#5B9BFF",
                  fontSize: 13,
                  background: "#16324F",
                  border: "1px solid #5B9BFF33",
                  borderRadius: 6,
                  padding: "10px 12px",
                  marginBottom: 14,
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "center",
                  gap: 10,
                  flexWrap: "wrap",
                }}
              >
                <span>{exportInfo}</span>
                <button
                  onClick={() => setExportInfo("")}
                  style={{ ...linkBtnStyle, color: "#5B9BFF" }}
                >
                  Tutup
                </button>
              </div>
            )}

            {filtered.length === 0 ? (
              <div
                style={{
                  textAlign: "center",
                  padding: "50px 20px",
                  color: "#64789C",
                  border: "1px dashed #24354F",
                  borderRadius: 8,
                  background: "#12233A",
                }}
              >
                {soal.length === 0
                  ? "Belum ada soal. Klik \"Tambah Soal\" untuk mulai mengisi bank soal Anda."
                  : "Tidak ada soal yang cocok dengan filter saat ini."}
              </div>
            ) : (
              filtered.map((item) => (
                <SoalCard
                  key={item.id}
                  item={item}
                  onDelete={deleteSoal}
                  onEdit={(data) => setModalState({ mode: "edit", data })}
                  expanded={expandedId === item.id}
                  onToggle={() => setExpandedId(expandedId === item.id ? null : item.id)}
                />
              ))
            )}
          </>
        )}

        {status === "ready" && tab === "evaluasi" && <EvalBuilder soal={soal} materiList={materiList} />}
      </div>

      {modalState && modalState.mode === "add" && !modalState.via && (
        <TambahSoalPilihan
          onClose={() => setModalState(null)}
          onPilih={(via) => setModalState({ mode: "add", via })}
        />
      )}

      {modalState && modalState.mode === "add" && modalState.via === "ai" && (
        <BuatSoalAIModal
          onClose={() => setModalState(null)}
          onBack={() => setModalState({ mode: "add" })}
          onSaveMany={handleSaveAI}
          materiList={materiList}
          submateriByMateri={submateriByMateri}
        />
      )}

      {modalState && (modalState.mode === "edit" || modalState.via === "manual") && (
        <SoalModal
          mode={modalState.mode}
          initialData={modalState.mode === "edit" ? modalState.data : null}
          onClose={() => setModalState(null)}
          onSave={handleSaveModal}
          materiList={materiList}
          submateriByMateri={submateriByMateri}
        />
      )}

      {importFileData && (
        <ImportModal
          fileData={importFileData}
          currentTotal={soal.length}
          onClose={() => setImportFileData(null)}
          onMerge={handleMergeImport}
          onReplace={handleReplaceImport}
        />
      )}

      {showReklasifikasi && (
        <ReklasifikasiPengukuranModal
          items={pengukuranTanpaSubmateri}
          onAssign={(id, submateri) => updateSoal(id, { submateri })}
          onClose={() => setShowReklasifikasi(false)}
        />
      )}

      {showCopyModal && (
        <CopyTextModal text={buildExportPayload()} onClose={() => setShowCopyModal(false)} />
      )}

      {showPasteModal && (
        <PasteImportModal
          error={importError}
          onImport={(text) => handleImportFromText(text)}
          onClose={() => setShowPasteModal(false)}
        />
      )}
    </div>
  );
}

function tabBtnStyle(active) {
  return {
    padding: "8px 16px",
    borderRadius: 6,
    border: active ? "1.5px solid #5B9BFF" : "1px solid #24354F",
    background: active ? "#5B9BFF" : "#12233A",
    color: active ? "#0A1420" : "#8DA0BC",
    fontSize: 13.5,
    fontWeight: 700,
    cursor: "pointer",
  };
}

// ==== PENGATURAN MAPEL + ROOT ====
function SetupMapel({ awal, onSimpan, onBatal }) {
  const [jenjang, setJenjang] = useState((awal && awal.jenjang) || "SMA");
  const [mapel, setMapel] = useState((awal && awal.mapel) || "");
  const [rumus, setRumus] = useState(awal ? !!awal.rumus : false);
  const [bahasa, setBahasa] = useState((awal && awal.bahasa) || "Indonesia");
  const [teks, setTeks] = useState(awal ? materiKeTeks(awal.materi) : "");
  const [err, setErr] = useState("");
  const saran = PAKET_MAPEL.filter((x) => x.jenjang === jenjang).map((x) => x.mapel);
  const cocok = PAKET_MAPEL.find((x) => x.jenjang === jenjang && x.mapel.toLowerCase() === mapel.trim().toLowerCase());
  const pilihBtn = (aktif) => ({ flex: 1, padding: "9px 10px", borderRadius: 6, cursor: "pointer", fontFamily: "inherit", fontSize: 14, fontWeight: aktif ? 700 : 500, border: aktif ? "2px solid #4C8DFF" : "1px solid #24354F", background: aktif ? "#16324F" : "#12233A", color: aktif ? "#4C8DFF" : "#8DA0BC" });
  const pakaiTemplate = () => {
    setTeks(materiKeTeks(materiTemplate(cocok)));
    setRumus(cocok.rumus);
    setBahasa(cocok.bahasa);
  };
  const simpan = () => {
    if (!mapel.trim()) { setErr("Nama mata pelajaran belum diisi."); return; }
    onSimpan({ mapel: mapel.trim(), jenjang, rumus, bahasa, materi: teksKeMateri(teks) });
  };
  return (
    <div style={{ minHeight: "100vh", background: "#0B1626", color: "#E4EAF3", padding: "36px 20px", fontFamily: "'Inter', system-ui, sans-serif" }}>
      <div style={{ maxWidth: 640, margin: "0 auto", display: "flex", flexDirection: "column", gap: 18 }}>
        <div>
          <h1 style={{ margin: 0, fontFamily: "Georgia, 'Iowan Old Style', serif", fontSize: 30, color: "#5B9BFF" }}>{awal ? "Atur Mapel dan Jenjang" : "Selamat datang di Bank Soal"}</h1>
          <p style={{ margin: "6px 0 0", color: "#8DA0BC", fontSize: 14, lineHeight: 1.6 }}>
            {awal
              ? "Mengubah pengaturan tidak menghapus soal yang sudah tersimpan."
              : "Atur dulu mata pelajaran dan jenjang yang akan Anda kelola. Pengaturan ini bisa diubah kapan saja."}
          </p>
        </div>
        <div>
          <label style={labelStyle}>Jenjang</label>
          <div style={{ display: "flex", gap: 8 }}>
            {JENJANG_LIST.map((j) => (<button key={j} onClick={() => setJenjang(j)} style={pilihBtn(jenjang === j)}>{j}</button>))}
          </div>
        </div>
        <div>
          <label style={labelStyle}>Mata pelajaran</label>
          <input list="setup-mapel-saran" value={mapel} onChange={(e) => setMapel(e.target.value)} placeholder="mis. Fisika, Matematika, IPA, Bahasa Indonesia" style={inputStyle} />
          <datalist id="setup-mapel-saran">{saran.map((m) => (<option key={m} value={m} />))}</datalist>
          {cocok && (
            <div style={{ marginTop: 8, display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
              <button onClick={pakaiTemplate} style={secondaryBtnStyle}>Isi materi dari template {cocok.mapel} {cocok.jenjang}</button>
              <span style={{ fontSize: 12, color: "#64789C" }}>Daftar di bawah akan diganti, lalu bisa Anda sunting.</span>
            </div>
          )}
        </div>
        <div>
          <label style={labelStyle}>Daftar materi dan submateri (opsional)</label>
          <textarea
            value={teks}
            onChange={(e) => setTeks(e.target.value)}
            rows={9}
            placeholder={"Satu materi per baris. Submateri dipisah titik koma.\nContoh:\nBilangan: Bilangan bulat; Pecahan; Perbandingan\nGeometri: Bangun datar; Bangun ruang"}
            style={{ ...inputStyle, resize: "vertical", fontFamily: "'JetBrains Mono', monospace", fontSize: 12.5, lineHeight: 1.6 }}
          />
          <div style={{ fontSize: 11.5, color: "#64789C", marginTop: 4 }}>Dipakai sebagai saran saat menambah soal dan membuat soal dengan AI. Anda tetap bisa mengetik materi lain kapan saja.</div>
        </div>
        <div style={{ display: "flex", gap: 20, flexWrap: "wrap" }}>
          <div style={{ flex: 1, minWidth: 220 }}>
            <label style={labelStyle}>Bahasa soal</label>
            <div style={{ display: "flex", gap: 8 }}>
              {["Indonesia", "Inggris"].map((b) => (<button key={b} onClick={() => setBahasa(b)} style={pilihBtn(bahasa === b)}>{b}</button>))}
            </div>
          </div>
          <div style={{ flex: 1, minWidth: 220 }}>
            <label style={labelStyle}>Notasi rumus</label>
            <label style={{ display: "flex", gap: 8, alignItems: "flex-start", fontSize: 13, color: "#C3CFE2", cursor: "pointer", lineHeight: 1.5 }}>
              <input type="checkbox" checked={rumus} onChange={(e) => setRumus(e.target.checked)} style={{ marginTop: 3 }} />
              <span>Aktifkan untuk mapel berumus (pangkat <code>^</code>, indeks <code>_</code>, <code>sqrt()</code>, <code>frac()</code>). Matikan untuk mapel teks agar tanda seperti <code>____</code> tidak rusak.</span>
            </label>
          </div>
        </div>
        {err && <div style={{ color: "#F87171", fontSize: 13 }}>{err}</div>}
        <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
          {onBatal && <button onClick={onBatal} style={secondaryBtnStyle}>Batal</button>}
          <button onClick={simpan} style={primaryBtnStyle}>{awal ? "Simpan pengaturan" : "Simpan dan mulai"}</button>
        </div>
      </div>
    </div>
  );
}

function Root() {
  const [pengaturan, setPengaturan] = useState(muatPengaturan);
  const [mengatur, setMengatur] = useState(false);
  const simpan = (x) => {
    try { localStorage.setItem(PENGATURAN_KEY, JSON.stringify(x)); } catch (e) { /* abaikan */ }
    setPengaturan(x);
    setMengatur(false);
  };
  if (!pengaturan || mengatur) {
    return <SetupMapel awal={pengaturan} onSimpan={simpan} onBatal={pengaturan ? () => setMengatur(false) : null} />;
  }
  aktifkanProfil({
    id: "kustom",
    mapel: pengaturan.mapel,
    jenjang: pengaturan.jenjang,
    rumus: !!pengaturan.rumus,
    bahasa: pengaturan.bahasa || "Indonesia",
    materi: pengaturan.materi || {},
    kunci: "bank-soal-fisika-data",
  });
  return <BankSoalFisika key={JSON.stringify(pengaturan)} onGantiPaket={() => setMengatur(true)} />;
}

const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<Root />);
</script>

  </body>
</html>
