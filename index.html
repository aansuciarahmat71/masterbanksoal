     fwrap.style.alignItems = 'center';\n        fwrap.style.verticalAlign = 'middle';\n        fwrap.style.margin = '0 2px';\n        fwrap.style.fontSize = '0.92em';\n        fwrap.style.lineHeight = '1.15';\n        var numEl = document.createElement('span');\n        numEl.style.padding = '0 3px';\n        renderMathNodes(node.num, numEl);\n        var line = document.createElement('span');\n        line.style.borderTop = '1.5px solid currentColor';\n        line.style.width = '100%';\n        var denEl = document.createElement('span');\n        denEl.style.padding = '0 3px';\n        renderMathNodes(node.den, denEl);\n        fwrap.appendChild(numEl);\n        fwrap.appendChild(line);\n        fwrap.appendChild(denEl);\n        container.appendChild(fwrap);\n      }\n    });\n  }\n\n  function renderMathInto(el, str) {\n    el.innerHTML = '';\n    if (!RUMUS) { el.textContent = String(str == null ? '' : str); return; }\n    renderMathNodes(parseMathJs(str), el);\n  }\n\n  function simpanProgress() {\n    try {\n      var nama = document.getElementById('nama') ? document.getElementById('nama').value.trim() : '';\n      var kelas = document.getElementById('kelas') ? document.getElementById('kelas').value.trim() : '';\n      var data = {\n        nama: nama,\n        kelas: kelas,\n        waktuMulai: waktuMulai,\n        questions: QUESTIONS,\n        answers: answers,\n        raguSet: raguSet,\n        currentIndex: currentIndex,\n        jumlahPelanggaran: jumlahPelanggaran,\n        logPelanggaran: logPelanggaran,\n        sudahMulai: sudahMulai,\n        sudahTerkirim: sudahTerkirim,\n        savedAt: Date.now()\n      };\n      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(data));\n    } catch (e) { /* localStorage tidak tersedia, abaikan */ }\n  }\n\n  function muatProgress() {\n    try {\n      var raw = window.localStorage.getItem(STORAGE_KEY);\n      if (!raw) return null;\n      var data = JSON.parse(raw);\n      if (!data || !data.sudahMulai || data.sudahTerkirim) return null;\n      if (!Array.isArray(data.questions) || data.questions.length === 0) return null;\n      return data;\n    } catch (e) { return null; }\n  }\n\n  function hapusProgress() {\n    try { window.localStorage.removeItem(STORAGE_KEY); } catch (e) { /* abaikan */ }\n  }\n\n  function tampilkanLayarUjian() {\n    document.getElementById('startScreen').style.display = 'none';\n    document.getElementById('cbtArea').style.display = 'flex';\n    if (ANTI_CURANG) mintaFullscreen();\n    buildNavGrid();\n    renderQuestion(currentIndex);\n    updatePelanggaranBox();\n    startTimer();\n  }\n\n  function cekProgressTersimpan() {\n    var data = muatProgress();\n    var box = document.getElementById('resumeBox');\n    if (!data) { box.style.display = 'none'; return; }\n    box.style.display = 'block';\n    var labelNama = data.nama ? (data.nama + (data.kelas ? ' (' + data.kelas + ')' : '')) : 'sesi sebelumnya';\n    box.innerHTML =\n      '<b>Ditemukan progres ujian yang belum selesai</b><br/>' +\n      'Atas nama <b>' + labelNama + '</b>, terakhir tersimpan ' + new Date(data.savedAt).toLocaleTimeString() + '.' +\n      ' Jika ini bukan Anda, pilih \"Mulai Ujian Baru\".' +\n      '<div class=\"resume-btns\">' +\n        '<button class=\"resume-btn-lanjut\" onclick=\"lanjutkanUjian()\">Lanjutkan Ujian Ini</button>' +\n        '<button class=\"resume-btn-baru\" onclick=\"mulaiUjianBaru()\">Mulai Ujian Baru</button>' +\n      '</div>';\n    if (data.nama && document.getElementById('nama')) document.getElementById('nama').value = data.nama;\n    if (data.kelas && document.getElementById('kelas')) document.getElementById('kelas').value = data.kelas;\n  }\n\n  function lanjutkanUjian() {\n    var data = muatProgress();\n    if (!data) return;\n    QUESTIONS = data.questions;\n    TOTAL_SOAL = QUESTIONS.length;\n    answers = data.answers || new Array(TOTAL_SOAL).fill(\"\");\n    raguSet = data.raguSet || {};\n    currentIndex = Math.min(data.currentIndex || 0, TOTAL_SOAL - 1);\n    jumlahPelanggaran = data.jumlahPelanggaran || 0;\n    logPelanggaran = data.logPelanggaran || [];\n    waktuMulai = data.waktuMulai;\n    sudahMulai = true;\n    if (DURATION_SECONDS > 0 && waktuMulai) {\n      var terlewat = Math.floor((Date.now() - waktuMulai) / 1000);\n      remainingSeconds = Math.max(0, DURATION_SECONDS - terlewat);\n    } else {\n      remainingSeconds = DURATION_SECONDS;\n    }\n    document.getElementById('resumeBox').style.display = 'none';\n    tampilkanLayarUjian();\n    if (remainingSeconds <= 0 && DURATION_SECONDS > 0) {\n      kuncSemuaInput();\n      kirimJawaban(true);\n    } else if (ANTI_CURANG && BATAS_PELANGGARAN > 0 && jumlahPelanggaran >= BATAS_PELANGGARAN) {\n      kuncSemuaInput();\n      kirimJawaban(true, true);\n      window.setTimeout(function () {\n        alert('Ujian ini sebelumnya sudah melewati batas pelanggaran. Jawaban Anda dikirim otomatis dan halaman akan ditutup.');\n      }, 200);\n    }\n  }\n\n  function mulaiUjianBaru() {\n    hapusProgress();\n    document.getElementById('resumeBox').style.display = 'none';\n    mulaiUjian();\n  }\n\n  function kocokArray(arr) {\n    var a = arr.slice();\n    for (var i = a.length - 1; i > 0; i--) {\n      var j = Math.floor(Math.random() * (i + 1));\n      var t = a[i]; a[i] = a[j]; a[j] = t;\n    }\n    return a;\n  }\n\n  function acakOpsiSoal(soal) {\n    if (soal.tipe !== 'pg' || !soal.opsi || soal.opsi.length === 0) return soal;\n    var opsiAcak = kocokArray(soal.opsi);\n    var hurufBaru = ['A', 'B', 'C', 'D', 'E'];\n    var indeksKunciBaru = -1;\n    for (var i = 0; i < opsiAcak.length; i++) {\n      if (opsiAcak[i].huruf === soal.kunci) { indeksKunciBaru = i; break; }\n    }\n    var opsiBaru = opsiAcak.map(function (o, i) { return { huruf: hurufBaru[i], teks: o.teks }; });\n    return {\n      id: soal.id,\n      tipe: soal.tipe,\n      teks: soal.teks,\n      gambar: soal.gambar || null,\n      materi: soal.materi || '',\n      submateri: soal.submateri || '',\n      opsi: opsiBaru,\n      kunci: indeksKunciBaru >= 0 ? hurufBaru[indeksKunciBaru] : soal.kunci\n    };\n  }\n\n  function distribusiMerataJS(kandidat, n, submateriKeys) {\n    if (n <= 0 || submateriKeys.length === 0) return [];\n    var grouped = {};\n    submateriKeys.forEach(function (sm) {\n      grouped[sm] = kocokArray(kandidat.filter(function (c) { return c.submateri === sm; }));\n    });\n    var k = submateriKeys.length;\n    var base = Math.floor(n / k);\n    var remainder = n % k;\n    var urutan = kocokArray(submateriKeys.slice());\n    var jatah = {};\n    urutan.forEach(function (sm, idx) {\n      jatah[sm] = base + (idx < remainder ? 1 : 0);\n    });\n    var hasil = [];\n    var kekurangan = 0;\n    var sisaPool = [];\n    urutan.forEach(function (sm) {\n      var avail = grouped[sm] || [];\n      var want = jatah[sm];\n      var ambil = avail.slice(0, want);\n      hasil = hasil.concat(ambil);\n      if (ambil.length < want) kekurangan += (want - ambil.length);\n      sisaPool = sisaPool.concat(avail.slice(want));\n    });\n    if (kekurangan > 0 && sisaPool.length > 0) {\n      hasil = hasil.concat(kocokArray(sisaPool).slice(0, kekurangan));\n    }\n    return hasil;\n  }\n\n  function pilihSoalJenis(jenisKey) {\n    var terpilih = [];\n    ['mudah', 'sedang', 'sukar'].forEach(function (tk) {\n      var n = (TARGET[jenisKey] && TARGET[jenisKey][tk]) || 0;\n      var kandidatTingkat = (POOL[jenisKey] && POOL[jenisKey][tk]) || [];\n      if (SUBMATERI_AKTIF.length > 0) {\n        terpilih = terpilih.concat(distribusiMerataJS(kandidatTingkat, n, SUBMATERI_AKTIF));\n      } else {\n        terpilih = terpilih.concat(kocokArray(kandidatTingkat).slice(0, n));\n      }\n    });\n    return terpilih;\n  }\n\n  function susunSoalUntukSiswa() {\n    if (MODE_SOAL === 'sama') {\n      // Soal, urutan soal, dan urutan opsi A-E dikunci sama persis untuk semua\n      // siswa (tidak ada pengacakan sama sekali) \u2014 sud veTimeout);\n        window.__bsfSaveTimeout = setTimeout(simpanProgress, 400);\n      });\n      area.appendChild(textarea);\n    }\n  }\n\n  function renderQuestion(idx) {\n    document.getElementById('progressText').textContent = 'Soal ' + (idx + 1) + ' dari ' + TOTAL_SOAL;\n    var labelEl = document.getElementById('sectionLabel');\n    if (SECTION_BREAK >= 0) {\n      labelEl.style.display = 'inline-block';\n      labelEl.textContent = idx < SECTION_BREAK ? 'Bagian A: Pilihan Ganda' : 'Bagian B: Esai';\n    } else {\n      labelEl.style.display = 'none';\n    }\n    renderMathInto(document.getElementById('soalText'), QUESTIONS[idx].teks);\n    var imgEl = document.getElementById('soalImage');\n    if (QUESTIONS[idx].gambar) {\n      imgEl.src = QUESTIONS[idx].gambar;\n      imgEl.style.display = 'block';\n    } else {\n      imgEl.src = '';\n      imgEl.style.display = 'none';\n    }\n    buildJawabanArea(idx);\n    document.getElementById('prevBtn').disabled = idx === 0;\n    document.getElementById('nextBtn').disabled = idx === TOTAL_SOAL - 1;\n    var raguBtn = document.getElementById('raguBtn');\n    raguBtn.className = 'btn btn-ragu' + (raguSet[idx] ? ' active' : '');\n    refreshAllNav();\n  }\n\n  function saveCurrentAnswer() {\n    var ta = document.getElementById('jawabanInput');\n    if (ta) answers[currentIndex] = ta.value;\n  }\n\n  function hitungSkor() {\n    var benar = 0;\n    var totalPg = 0;\n    for (var i = 0; i < TOTAL_SOAL; i++) {\n      var q = QUESTIONS[i];\n      if (q.tipe === 'pg' && q.kunci) {\n        totalPg++;\n        if (answers[i] === q.kunci) benar++;\n      }\n    }\n    var skor = totalPg > 0 ? Math.round((benar / totalPg) * 100) : null;\n    return { benar: benar, totalPg: totalPg, skor: skor };\n  }\n\n  function goTo(idx) {\n    if (idx < 0 || idx >= TOTAL_SOAL) return;\n    saveCurrentAnswer();\n    currentIndex = idx;\n    renderQuestion(currentIndex);\n    simpanProgress();\n  }\n\n  function toggleRagu() {\n    if (ra
